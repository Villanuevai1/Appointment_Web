# Application properties for Appointment_Web
server.port=8080
spring.thymeleaf.cache=false

# SQLite datasource
spring.datasource.url=jdbc:sqlite:appointments.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Enable WAL mode for better concurrent write handling
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;
spring.datasource.hikari.maximum-pool-size=5

# Auto-run schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
